<!DOCTYPE html>
<html>
<head>
    <title>Textbox Input</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-image: url('https://french-wine-thailand.com/wp-content/uploads/2021/09/All-about-red-wine.jpg');
            background-size: cover;
            background-repeat: no-repeat;
        }
        h2 {
            font-size: 45px;
            text-align: center;
            color: white;
            text-shadow: 4px 4px 6px black;
        }

        form {
            text-align: center;
        }

        input[type="text"] {
            padding: 10px;
            font-size: 14px;
            margin: 1px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Uncork Your Curiosity</h2>
        <form method="POST">
            <input type="text" name="query" placeholder="Search here">
        </form>
    </div>
</body>
</html>
